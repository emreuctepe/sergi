<!doctype html>
<html lang="tr" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!--
			Tema, ilk boyadan ÖNCE uygulanmalı. Svelte'in devralmasını beklersek
			koyu temayı seçmiş okur her açılışta bir kare beyaz görür (FOUC).
			Bu yüzden burada, senkron ve <head> içinde.

			Depolama anahtarı markadan bağımsız (`mag:` = magazine, kod içi ad):
			marka adı değişince okurların tercihi sıfırlanmasın diye.

			⚠️ CSP eklenirken bu betiğin sha256 hash'i script-src'ye girecek.
		-->
		<script>
			try {
				var t = localStorage.getItem('mag:theme');
				if (!t || t === 'system') {
					t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.dataset.theme = t;
			} catch (e) {
				/* localStorage kapalı (gizli sekme, sıkı gizlilik ayarı) — aydınlıkta kal. */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!--
			Uygulama doğrudan <body>'ye değil, kendi kabına basılıyor.

			Neden: hidrasyon, sunucudan gelen DOM'un beklendiği gibi olmasına
			dayanıyor. Bir tarayıcı eklentisi (ya da bir önizleme aracı) <body>'nin
			içine bir düğüm sokarsa sıra kayıyor, Svelte "hydration_mismatch" deyip
			ağacı temizliyor ve okur BOŞ BİR SAYFA görüyor. Bu, geliştirirken
			gerçekten başımıza geldi: sayfa iframe içinde açılınca çalışıyor,
			sekmenin kendisinde bomboş geliyordu.

			`display: contents` kabın kendisini düzenden çıkarır — sarmalayıcı
			var ama hiçbir şeye mal olmuyor.
		-->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
