<!doctype html>
<html lang="tr" data-theme="light" data-issue="2026-09">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <title>Dergi · Prototip</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Sosyal dergi prototipi — sahte veri, gerçek deneyim." />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/canvas.css" />
    <link rel="stylesheet" href="css/blocks.css" />
    <link rel="stylesheet" href="css/comments.css" />
    <link rel="stylesheet" href="css/overlays.css" />
    <link rel="stylesheet" href="css/puzzles.css" />
    <link rel="stylesheet" href="css/analytics.css" />
  </head>

  <body>
    <a class="skip-link" href="#pages">İçeriğe atla</a>

    <!-- =====================================================================
         KABUK — genişliği tuvale eşit, yüksekliği ekrana eşit.
         Tuval dikeyde ortalanır; üstte/altta kalan letterbox boşluğu
         arayüzün kendisi olur.
         ================================================================== -->
    <div id="shell" data-letterbox="roomy">
      <!-- ÜST BANT ---------------------------------------------------------- -->
      <header id="band-top" class="band band--top">
        <button
          id="btn-menu"
          class="band__btn"
          type="button"
          aria-label="Menü"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" class="icon">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>

        <div class="band__center">
          <button id="btn-depth" class="depth-chip" type="button" aria-haspopup="true">
            <span class="depth-chip__bars" aria-hidden="true"
              ><i></i><i></i><i></i
            ></span>
            <span id="depth-label" class="depth-chip__label">Orta</span>
          </button>
          <div id="issue-tag" class="band__issue">
            <span class="band__issue-no">03</span>
            <span class="band__issue-name">Kızıl Mevsim</span>
          </div>
        </div>

        <button id="btn-lang" class="band__btn band__btn--text" type="button" aria-label="Dil">
          TR
        </button>

        <!-- okuma ilerlemesi -->
        <div
          id="progress"
          class="progress"
          role="progressbar"
          aria-label="Okuma ilerlemesi"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="progress-fill" class="progress__fill"></div>
        </div>
      </header>

      <!-- TUVAL ------------------------------------------------------------- -->
      <main id="canvas" class="canvas" aria-label="Dergi tuvali">
        <div id="pages" class="pages" tabindex="-1">
          <!-- sayfalar js/render.js tarafından basılır -->
        </div>

        <!-- yorum katmanı: tuvalin üstünde, sayfayla birlikte hareket eder -->
        <div id="comment-layer" class="comment-layer" aria-hidden="true"></div>

        <!-- metin seçimi balonu -->
        <div id="selection-bubble" class="selection-bubble" hidden>
          <button type="button" data-act="comment">
            <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
              <path d="M21 12a8 8 0 1 1-3.2-6.4M21 5v4h-4" />
            </svg>
            Yorum yaz
          </button>
          <button type="button" data-act="quote">
            <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
              <path d="M7 7h4v4a4 4 0 0 1-4 4M15 7h4v4a4 4 0 0 1-4 4" />
            </svg>
            Alıntıla
          </button>
        </div>

        <!-- sayfa kenarı: bölüm adı + sayfa numarası -->
        <div id="folio" class="folio" aria-hidden="true">
          <span id="folio-section"></span>
          <span id="folio-page"></span>
        </div>
      </main>

      <!-- ALT BANT ---------------------------------------------------------- -->
      <footer id="band-bottom" class="band band--bottom">
        <!-- sayfa gezinme: yukarı + aşağı yan yana -->
        <div class="band__nav">
          <button id="btn-prev" class="band__btn" type="button" aria-label="Önceki sayfa">
            <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
              <path d="M18 15l-6-6-6 6" />
            </svg>
          </button>
          <button id="btn-next" class="band__btn" type="button" aria-label="Sonraki sayfa">
            <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
              <path d="M6 9l6 6 6-6" />
            </svg>
          </button>
        </div>

        <!-- eylemler: beğen · yorum · paylaş (şimdilik yalnız yorum işlevsel) -->
        <div class="band__actions">
          <button id="btn-like" class="band__act" type="button" aria-label="Beğen" data-fake="true">
            <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
              <path d="M12 21s-7-4.35-9.5-8.5C.5 9 2.5 5.5 6 5.5c2 0 3.2 1.2 4 2.4.8-1.2 2-2.4 4-2.4 3.5 0 5.5 3.5 3.5 7C19 16.65 12 21 12 21Z" />
            </svg>
          </button>

          <button id="btn-comments" class="band__act band__act--toggle" type="button" aria-pressed="false" aria-label="Eş okuma">
            <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>

          <button id="btn-share" class="band__act" type="button" aria-label="Paylaş" data-fake="true">
            <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
              <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 15V3M8 7l4-4 4 4" />
            </svg>
          </button>
        </div>
      </footer>
    </div>

    <!-- =====================================================================
         KATMANLAR — tuvalin dışında yaşayan her şey
         ================================================================== -->
    <div id="overlays">
      <div id="scrim" class="scrim" hidden></div>
      <aside id="menu-panel" class="panel panel--left" hidden></aside>
      <aside id="thread-panel" class="panel panel--bottom" hidden></aside>
      <div id="modal-host" class="modal-host" hidden></div>
      <div id="toast-host" class="toast-host" aria-live="polite"></div>
      <div id="intro-host" class="intro-host" hidden></div>
    </div>

    <!-- =====================================================================
         BETİKLER — klasik etiketler, ES modül yok (file:// uyumluluğu için).
         Sıra önemlidir: art → data → çekirdek → özellikler → boot.
         ================================================================== -->
    <script src="js/util.js"></script>
    <script src="js/art.js"></script>
    <script src="js/data.js"></script>
    <script src="js/data-comments.js"></script>
    <script src="js/data-analytics.js"></script>
    <script src="js/state.js"></script>
    <script src="js/render.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/comments.js"></script>
    <script src="js/popup.js"></script>
    <script src="js/identity.js"></script>
    <script src="js/puzzles.js"></script>
    <script src="js/overlays.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/debug.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
