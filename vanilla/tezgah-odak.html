<!doctype html>
<!--
  ════════════════════════════════════════════════════════════════════════════
  TEZGÂH · ODAK — açılan eserin kartı (ms-galeri)
  ────────────────────────────────────────────────────────────────────────────
  `tezgah-galeri.html` KORİDORU gösteriyor; burası tek bir eserin AÇILMIŞ
  hâlini. Ayrı dosya olmasının sebebi kadraj: kartı yargılamak için ekranda
  yalnız tuval olmalı, yanında kayıtlar ve kırpılmamış şerit olmamalı.

  ⚠️ ASIL İŞİ BAŞSIZ TARAYICIYA POZ VERMEK. Tarayıcı panelinin screenshot yolu
  bu makinede kilitleniyor, ölçüm ve bakma yolu `referans/araclar/kartbas.sh`
  (flatpak Chromium --headless). Kart oradan tıklanamadığı için burada kendisi
  açılıyor ve durumlar sorgu dizesinden seçiliyor:

      ?          uzun sergi metniyle (yazı yazıldığındaki hâli)
      ?bos=1     metinsiz künye — SAYININ ŞU ANKİ GERÇEK HÂLİ
      ?kapali=1  koridorun kendisi, kart açılmadan
      ?kaydir=N  kartı N piksel kaydırılmış göster (dipteki solmayı görmek için)

  ⚠️ SAYFAYI KOPYALAMIYOR, FETCH EDİYOR — `tezgah-galeri.html` ile aynı gerekçe.
  Buradaki metin ve görsel ÖRNEK: gerçek künyeler `uret.py` §ESERLER'de duruyor
  ve henüz yazılmadı. Sayı bu dosyaya bakmıyor; silinse aynen çalışır.
  ════════════════════════════════════════════════════════════════════════════
-->
<html lang="tr" data-theme="dark" data-issue="2026-09" data-depth="full">
  <head>
    <meta charset="utf-8" />
    <title>Tezgâh · odak kartı</title>
    <link rel="stylesheet" href="css/app.css" />
    <style>
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #14140f;
      }
      .kutu {
        --canvas-w: 560px;
        --canvas-h: 747px;
        width: var(--canvas-w);
        height: var(--canvas-h);
        position: relative;
        container-type: inline-size;
      }
      .kutu .page {
        position: absolute;
        inset: 0;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="kutu" id="yuva"></div>

    <script type="module">
      import { galeriBaslat } from './js/galeri.js';

      const AD = 'Kırılan Ay';
      const ALT = 'Hokusai Sanjo · kâğıt üzerine mürekkep ve altın varak, 1847';
      const METIN =
        'Masalın ortasındaki bu sahne, akıllı kızın babasını kurtarmak için ' +
        'beyin sancağını ilk kez kaldırdığı andır. Ressam olayı gecenin ' +
        'içine taşımış: pirinç tarlasının üstünde duran ay tam ikiye ' +
        'bölünmüş ve iki yarısı da suya düşmüş. Dönemin ahşap baskı ' +
        'geleneğinde ay bütünlüğün simgesidir; burada kırılması, kızın ' +
        'köyün kurallarını çiğneyerek konuşmasına karşılık geliyor. ' +
        'Sağ alt köşedeki mühür ressamın kendi değil, sonradan eseri ' +
        'satın alan tüccarın mührüdür — eserin iki yüz yıllık yolculuğunda ' +
        'kaç el değiştirdiğini gösteren tek iz.';

      /* Yer tutucu yerine gerçekçi bir "eser": düz yüzeyli, konturusuz. */
      const ESER =
        'data:image/svg+xml;utf8,' +
        encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 554">
          <rect width="828" height="554" fill="#1d2733"/>
          <rect y="300" width="828" height="254" fill="#25323f"/>
          <path d="M0 300 L300 214 L520 268 L828 196 L828 300Z" fill="#2f3d49"/>
          <path d="M0 340 L360 300 L828 356 L828 300 L0 300Z" fill="#1a242e"/>
          <circle cx="600" cy="140" r="72" fill="#e8d9b0"/>
          <path d="M600 68 L672 140 L600 212Z" fill="#25323f"/>
          <path d="M120 554 L250 380 L360 554Z" fill="#121a22"/>
          <path d="M540 420 L620 340 L700 420 L660 554 L580 554Z" fill="#0f161d"/>
          <path d="M0 470 L828 440 L828 554 L0 554Z" fill="#0d1319"/>
        </svg>`);

      const ham = await (await fetch('sayfalar/ms-galeri/sayfa.html', { cache: 'no-store' })).text();
      const t = document.createElement('template');
      t.innerHTML = ham;
      const bolum = t.content.firstElementChild;

      /* Künye verisini gerçek bir sergi metniyle doldur. */
      const bos = new URLSearchParams(location.search).has('bos');
      const veri = JSON.parse(bolum.querySelector('.galeri__veri').textContent);
      for (const e of veri) {
        e.dosya = ESER;
        e.ad = bos ? e.ad : AD;
        e.alt = bos ? '' : ALT;
        e.metin = bos ? '' : METIN;
      }
      bolum.querySelector('.galeri__veri').textContent = JSON.stringify(veri);

      document.getElementById('yuva').append(bolum);
      galeriBaslat();

      /* Kart açık başlasın — başsız tarayıcı tıklayamıyor.
         ?bos=1 → metinsiz künye, ?kapali=1 → koridorun kendisi. */
      const soru = new URLSearchParams(location.search);
      if (!soru.has('kapali')) {
        setTimeout(() => {
          document.querySelector('.galeri__hedef').click();
          if (soru.has('kaydir')) {
            const k = document.querySelector('.galeri__kart');
            k.scrollTop = Number(soru.get('kaydir'));
          }
          document.documentElement.dataset.hazir = '1';
        }, 400);
      }
    </script>
  </body>
</html>
