<!doctype html>
<!--
  ════════════════════════════════════════════════════════════════════════════
  TEZGÂH · KARIŞTIR — sunuş sayfasının ölçü aletleri
  ────────────────────────────────────────────────────────────────────────────
  ⚠️ KOREOGRAFİ ARTIK BU DOSYADA DEĞİL. Sayfa sayıya girdi (`ed-sunus`) ve
  koreografi onunla birlikte `js/sunus.js`e taşındı. Burada kalan tek şey ÖLÇÜ
  ALETLERİ — tezgâhın asıl işi zaten oydu.

  Bu, kopyalamaya yeğlendi: tezgâh kendi koreografisini taşısaydı sayıdakiyle
  ayrışması an meselesiydi. Şimdi tezgâh sayının OYNATTIĞI zinciri oynatıyor,
  yalnız etrafına ölçüm sarıyor.

    js/sunus.js      koreografi — hangi metin, hangi sırayla, kaç milisaniye
    js/hikaye.js     kabuk: süre çubukları, dokunma bölgeleri, duraklatma
    js/karistir.js   1, 2 ve 6. dilim: metni karakter karakter çözen motor
    js/yazi.js       3, 4 ve 5. dilim: süpürme, daktilo, netleşme
    js/perde.js      yazının arkasındaki SVG sahneyi satır içine indirir

  İŞARETLEME DE BURADA DEĞİL: sayfa `sayfalar/ed-sunus/sayfa.html`ten fetch
  ediliyor. Elle kopyalansaydı 23 kopyalı baklava diliminin iki hâli olurdu ve
  tezgâh sayının göstermediği bir kompozisyonu ölçerdi.

  ────────────────────────────────────────────────────────────────────────────
  ÜÇ ÖLÇÜ ALETİ (sağ üstte) — üçü de bakarak karar vermemek için
  ────────────────────────────────────────────────────────────────────────────
  ① GENİŞLİK ZIPLAMASI + TAŞMA. Karışma sırasında metin her karede değişiyor;
     orantılı bir yazı tipinde karakterlerin eni farklı olduğu için satırın
     genişliği oynuyor ve göz bunu "zıplama" diye görüyor. Panel karışma
     boyunca satırın en dar ve en geniş hâlini kaydedip farkı yazıyor.

     Aynı panelin alt yarısı TAŞMAYI ölçüyor: her geçişin en geniş karesi
     tuvalin yüzde kaçı. Tek punto olduğu için (`css/blocks.css` §SUNUŞ)
     hiyerarşiyi `OLCEK` sayıları kuruyor ve bunlar ancak ölçülerek
     seçilebilir — %100'ü aşan satır kadraja sığmıyor demektir.

  ② DİLİM SÜRELERİ. Bir dilimin BEYAN EDİLEN süresi (çubuğun dolma süresi)
     koreografinin GERÇEK süresinden kısaysa animasyon ortasından kesilir — ve
     bu göze "biraz hızlı" diye görünür, hata diye değil. Panel her dilimin
     beyan/ölçülen/pay üçlüsünü yazıyor; pay negatifse kırmızı.

     ⚠️ Son üç dilimin süresi ELLE YAZILMIYOR, metnin uzunluğundan hesaplanıyor
     (`js/sunus.js` §SÜRELER). Yani bu panel artık yalnız "süre yetiyor mu"yu
     değil, HESABIN DOĞRU OLUP OLMADIĞINI da ölçüyor.

  ③ KONTRAST — ⚠️ PERDE OPAKLIĞININ TEK GEREKÇESİ. Yazının arkasında artık düz
     renk değil bir SVG sahne duruyor ve sahne ne kadar görünürse yazı o kadar
     zorlaşıyor. Panel her perdenin HER `fill` rengini zeminle `α` oranında
     bindirip `--ink` ile WCAG kontrastını hesaplıyor, en kötüsünü yazıyor, ve
     "eşiği geçen en yüksek opaklık" sütununda hangi değere kadar
     çıkılabileceğini söylüyor.

     Bindirme analitik (`sonuç = zemin·(1-α) + katman·α`), yani ekran
     görüntüsü gerekmiyor — bu makinede rasterleştirici yok (aynı kaygı
     `js/karistir.js` §ÇEKİRDEK'te de yazılı).

     ⚠️ SONUÇ KÖTÜMSER, bilerek: SVG'nin İÇİNDEKİ grup opaklıkları (`09.svg`de
     yağmur çizgileri `opacity="0.55"`) hesaba katılmıyor ve her `fill` en
     üstteymiş gibi sayılıyor. Hatanın yönü güvenli tarafta.

      ?yazi=display   hangi yazı tipi yığını (varsayılan)
      ?yazi=text      · ?yazi=manga · ?yazi=mono
      ?sabit=1        ortadaki satıra `ch` cinsinden sabit genişlik verir —
                      zıplamanın ilacı bu mu, ölçüyle karşılaştır
      ?oku=6000       SÖZLERİN EKRANDA DURMA süresi (ms) — sozler dilimindeki
                      dokuz cümlenin okunabildiği an. Varsayılan `SOZ_OKUMA`.
                      ⚠️ Bunu büyütürsen `sozler` diliminin `sure`si de büyüyor
                      (türetiliyor), yani çubuk kendiliğinden uzuyor.
      ?opak=0.45      perde opaklığı (`--kr-perde-opak`) — KONTRAST panosuyla
                      birlikte kullan: panel bu değerde kaç kaldığını yazıyor
      ?yavas=3        her şeyi 3 kat yavaşlatır — dilim süreleri dahil
      ?dilim=cagri    hangi dilimde başla
                      (baslik | sozler | sehir | icerik | cagri | kunye)
      ?dongu=0        BAŞA SARMAYI KAPATIR. ⚠️ Varsayılan artık AÇIK, çünkü sayı
                      `dongu: true` ile çalışıyor (`js/sunus.js` §SAYI) ve
                      tezgâh sayının kurulumunu oynatmalı. Tek turu görmek
                      için bu parametre var.
      ?gorus=0        "ekrandan çıkınca duraklat"ı kapatır — IntersectionObserver
                      yanlış yüzeyde hikâyeyi kalıcı duraklı bırakırsa kaçış
                      kapısı bu (bkz. `js/hikaye.js` §EKRANDAN ÇIKTI)
      ?en=560&boy=747 tuval ölçüsü
      ?tema=light     açık temada dene
      ?hareket=off    hareket azaltmayı taklit eder (`data-motion="off"`):
                      otomatik geçiş kapanır, hikâye elle gezilen bir slayt
                      gösterisine döner. Sayıda bu değer `localStorage`dan
                      gelir; tezgâhta o akış olmadığı için parametre.
      ?dur=1          saat işlemez — ilk dilim oynar ve orada durur (poz için)

  Gezinme: sol/sağ kenara tıkla, ok tuşlarına bas, ya da basılı tut (duraklar).
  ════════════════════════════════════════════════════════════════════════════
-->
<html lang="tr" data-theme="dark" data-issue="2026-09" data-depth="full">
  <head>
    <meta charset="utf-8" />
    <title>Tezgâh · karıştır</title>
    <link rel="stylesheet" href="css/app.css" />
    <style>
      /* ⚠️ SAYFANIN KENDİ KURALLARI BURADA DEĞİL. `.kr` bloğu sayıya taşındı
         (`css/blocks.css` §SUNUŞ) ve `app.css` zaten onu çağırıyor. Burada
         yalnız TEZGÂHA ait olan, taşınmayacak olan şeyler var. */

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #14140f;
        font-family: var(--font-ui);
      }
      .kutu {
        width: var(--canvas-w);
        height: var(--canvas-h);
        position: relative;
        container-type: inline-size;
        overflow: hidden;
      }
      /* Sayıda bu işi `.pages` akışı yapıyor; tezgâhta tek sayfa var. */
      .kutu .page {
        position: absolute;
        inset: 0;
        height: 100%;
      }

      /* ────────────────────────────────────────────────────────────────────
         ÖLÇÜ ALETLERİ
         ──────────────────────────────────────────────────────────────────── */

      .olculer {
        position: fixed;
        top: 12px;
        right: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        z-index: 10;
      }
      .olcu {
        padding: 10px 14px;
        border-radius: 8px;
        background: #0008;
        backdrop-filter: blur(6px);
        color: #e8e2d6;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.7;
        white-space: pre;
      }
      .olcu b { color: #ffd479; font-weight: 600; }
      .olcu .kotu { color: #ff8b6b; }
      .olcu .iyi { color: #9fe08f; }

      .dugmeler {
        position: fixed;
        bottom: 12px;
        right: 12px;
        display: flex;
        gap: 8px;
        z-index: 10;
      }
      .dugmeler button {
        padding: 8px 16px;
        border: 0;
        border-radius: 999px;
        background: #e8e2d6;
        color: #14140f;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="kutu" id="yuva"><!-- sayfa buraya fetch ile giriyor --></div>

    <div class="olculer">
      <div class="olcu" id="olcu">ölçüm bekleniyor…</div>
      <div class="olcu" id="olcu-perde">kontrast bekleniyor…</div>
      <div class="olcu" id="olcu-sure">dilim süreleri bekleniyor…</div>
    </div>
    <div class="dugmeler">
      <button type="button" id="olcum">Yeniden ölç</button>
      <button type="button" id="duraklat">Duraklat</button>
      <button type="button" id="tekrar">Tekrar</button>
    </div>

    <script type="module">
      import { karisim, azHareket } from './js/karistir.js';
      import { hikaye } from './js/hikaye.js';
      import {
        ALT_BASLIK,
        BASLIK,
        DILIM_PERDESI,
        KARISMA,
        KUNYE_META,
        KUNYE_NO,
        OLCEK,
        SAYI_AYARI,
        SOZ_OKUMA,
        TARLA_KELIMESI,
        dilimleriKur
      } from './js/sunus.js';

      const soru = new URLSearchParams(location.search);
      if (soru.get('tema') === 'light') document.documentElement.dataset.theme = 'light';

      /* ⚠️ HAREKET TERCİHİ MODÜLÜN EN BAŞINDA. `azHareket()`i hem `hikaye()`
         hem `karistir()` KURULURKEN okuyor; buraya sonradan yazılsa otomatik
         geçiş açık doğar ve tercih yalnız yarısına işlerdi.

         Sayıda bu değer `localStorage`dan geliyor (`index.html` §tema-betigi);
         tezgâhta o akış yok, o yüzden parametre. Onsuz hareket azaltma yolu
         bu dosyadan HİÇ sınanamıyordu — yenileme `data-motion`ı siliyor. */
      if (soru.get('hareket') === 'off') document.documentElement.dataset.motion = 'off';

      const en = Number(soru.get('en') ?? 560);
      const boy = Number(soru.get('boy') ?? Math.round((en * 4) / 3));
      const yuva = document.getElementById('yuva');
      yuva.style.setProperty('--canvas-w', en + 'px');
      yuva.style.setProperty('--canvas-h', boy + 'px');

      /* ⚠️ SAYFA FETCH EDİLİYOR, KOPYALANMIYOR. Sayının gösterdiği işaretlemenin
         aynısı ölçülüyor; elle yazılmış bir kopya ilk düzenlemede ayrışırdı.
         Bedeli: bu dosya artık `file://` altında çalışmıyor — sayının kendisi
         de çalışmıyor (bkz. BENIOKU). */
      const cevap = await fetch('sayfalar/ed-sunus/sayfa.html');
      if (!cevap.ok) throw new Error(`Sunuş sayfası okunamadı (${cevap.status})`);
      yuva.innerHTML = await cevap.text();

      const sahne = yuva.querySelector('.kr');

      /* Yazı tipi seçimi — sınanan şeyin ta kendisi. */
      const YAZILAR = {
        display: 'var(--font-display)',
        text: 'var(--font-text)',
        manga: 'var(--font-manga)',
        mono: 'var(--font-mono)'
      };
      const yaziAdi = soru.get('yazi') ?? 'display';
      sahne.style.setProperty('--kr-yazi', YAZILAR[yaziAdi] ?? YAZILAR.display);
      if (soru.get('sabit') === '1') sahne.dataset.sabit = '1';

      const YAVAS = Number(soru.get('yavas') ?? 1);
      const SOZ_SURESI = Number(soru.get('oku') ?? SOZ_OKUMA);

      /* Perde opaklığı. Varsayılanı YAZMIYORUZ: `css/sunus.css`teki değer
         sayının gerçek değeri ve tezgâh onu oynatmalı. Parametre verilirse
         ezen bir satır iniyor ve KONTRAST panosu o değeri ölçüyor. */
      if (soru.has('opak')) {
        sahne.style.setProperty('--kr-perde-opak', soru.get('opak'));
      }

      /* ⚠️ KOREOGRAFİ SAYIDAN GELİYOR. Tezgâhın verdiği tek şey iki knob:
         yavaşlatma ve okuma süresi. Zincirin kendisi, süreleri, tohumları —
         hepsi `js/sunus.js`te ve sayı da aynı satırları oynatıyor. */
      const { dilimler, merkez, kunye, perdeler } = await dilimleriKur(sahne, {
        yavas: YAVAS,
        oku: SOZ_SURESI
      });

      /* ====================================================================
         ÖLÇÜ ① — GENİŞLİK ZIPLAMASI · EŞZAMANLI, rAF'SIZ
         --------------------------------------------------------------------
         ⚠️ ÖLÇÜM OYNATMAYA BAĞLI DEĞİL, bilerek. `karisim()` saf olduğu için
         kareler elle üretilip elemana basılabiliyor ve genişlik her karede
         eşzamanlı okunabiliyor. Bunun iki kazancı var:

           · rAF'ın ateşlemediği ortamlarda (bkz. `js/karistir.js` §ÇEKİRDEK)
             sayı yine de alınabiliyor.
           · Ölçüm oynatma hızından bağımsız: 60fps'te kaçırılan bir ara kare
             ölçüde gözden kaçmıyor, çünkü kareleri biz seçiyoruz.

         Ölçülen şey `getBoundingClientRect().width` — gerçekten çizilen kutu.
         `scrollWidth` yuvarlıyor ve tam da aradığımız yarım pikselleri yutuyor.
         ==================================================================== */
      const olcuKutusu = document.getElementById('olcu');

      const YAZI_ADLARI = ['display', 'text', 'manga', 'mono'];
      const KARE_SAYISI = 90;

      /**
       * Bir geçişi baştan sona basıp en dar/en geniş hâlini döndürür.
       * Elemanı ölçüm bitince eski metnine geri bırakıyor.
       */
      function olc(el, basla, hedef, ayar) {
        const eski = el.textContent;
        const k = karisim(basla, hedef, ayar);
        let enDar = Infinity;
        let enGenis = 0;

        for (let i = 0; i <= KARE_SAYISI; i++) {
          el.textContent = k.kare((i / KARE_SAYISI) * k.sure);
          const g = el.getBoundingClientRect().width;
          if (g > 0) {
            enDar = Math.min(enDar, g);
            enGenis = Math.max(enGenis, g);
          }
        }
        el.textContent = eski;
        return { enDar, enGenis, fark: enGenis - enDar };
      }

      /**
       * Bir yığının GERÇEKTEN hangi yüze çözüldüğünü söyler.
       *
       * ⚠️ ŞART, süs değil. Bu makinede `--font-display` (Iowan Old Style,
       * Palatino…) ve `--font-text` (Georgia…) kurulu DEĞİL; ikisi de generic
       * serif'e düşüyor ve ölçüde birebir aynı sayıyı veriyorlar. O sayıya
       * bakıp "Iowan şu kadar zıplıyor" demek yanlış olurdu. Yığının adı
       * yerine ÇİZİLEN yüzün parmak izi yazılıyor: aynı genişlik = aynı yüz.
       *
       * Yalnız `--font-manga` gerçek: `fonts.css` Bad Comic'i oraya bağlıyor
       * ve dosya `fonts/badcomic.woff2` olarak sayıyla birlikte geliyor.
       */
      function parmakIzi(ad) {
        const c = document.createElement('span');
        c.style.cssText =
          'position:absolute;left:-9999px;white-space:nowrap;font-size:64px;font-family:' +
          YAZILAR[ad];
        c.textContent = BASLIK;
        document.body.append(c);
        const w = c.getBoundingClientRect().width;
        c.remove();

        const bad = document.fonts.check('64px "Bad Comic"');
        return `[${w.toFixed(0)}px${ad === 'manga' && bad ? ' ·BadComic' : ''}]`;
      }

      /* ⚠️ ÖLÇÜLEN GEÇİŞLER KOREOGRAFİNİN KENDİ GEÇİŞLERİ — ve artık bu bir
         DİLEK değil, yapısal. Ayarlar `KARISMA`dan geliyor, yani oynatılan
         `karistir()` çağrısıyla ölçülen kare AYNI satırdan besleniyor. Bir
         dönem burada elle yazılmış bir liste vardı; koreografi yeniden
         yazılınca liste akışta artık olmayan bir çifti ölçmeye devam etti
         ('sErgi' → 'Kızıl Mevsim' tek adımda kalmamıştı) ve panel ekranda hiç
         görünmeyen bir şeyin sayısını yazdı. */
      const GECISLER = [
        { ad: '① →tarla', el: () => merkez, a: '', b: TARLA_KELIMESI,
          olcek: OLCEK.tarla, ayar: KARISMA.tarla },
        { ad: '④ →başlık', el: () => merkez, a: TARLA_KELIMESI, b: BASLIK,
          olcek: OLCEK.baslik, ayar: KARISMA.baslik },
        { ad: '⑤ →alt', el: () => merkez, a: BASLIK, b: ALT_BASLIK,
          olcek: OLCEK.alt, ayar: KARISMA.alt },
        { ad: '⑥ →boş', el: () => merkez, a: ALT_BASLIK, b: '',
          olcek: OLCEK.alt, ayar: KARISMA.bosluk },
        { ad: 'künye →meta', el: () => kunye, a: '', b: KUNYE_META,
          olcek: OLCEK.kunye, ayar: KARISMA.kunyeMeta },
        { ad: 'künye →no', el: () => kunye, a: KUNYE_META, b: KUNYE_NO,
          olcek: OLCEK.kunye, ayar: KARISMA.kunyeNo }
      ];

      /**
       * Ölçüm boyunca geçişleri kapatır ve slaytın kendi ölçeğini 1'e sabitler.
       *
       * ⚠️ İKİSİ DE ŞART. `--kr-olcek` bir CSS geçişi (900ms); ölçekle birlikte
       * hemen ölçülürse okunan sayı ESKİ ölçeğin sayısı olur. Slaytın kendi
       * `--kr-slayt-olcek`i ise ölçüme çarpan olarak binerdi — açılışta 0.75
       * iken alınan her genişlik dörtte bir eksik çıkardı.
       */
      function olcumKipi(acik) {
        if (acik) {
          sahne.dataset.olcum = '1';
          for (const k of sahne.querySelectorAll('.kr__slayt')) {
            k.style.setProperty('--kr-slayt-olcek', '1');
          }
        } else {
          delete sahne.dataset.olcum;
        }
        void sahne.offsetWidth;
      }

      /**
       * Aynı geçişi DÖRT YAZI TİPİNDE ve sabit-genişlikli hâliyle ölçer,
       * ayrıca her DURUMUN tuvale sığıp sığmadığını yazar.
       */
      function karsilastir() {
        /* Eşik keyfi değil, tuvale göre: oran olarak yazılıyor ki tuval ölçüsü
           değişince eşik de değişsin. */
        const esik = en * 0.015;
        const oncekiYazi = sahne.style.getPropertyValue('--kr-yazi');
        const oncekiSabit = sahne.dataset.sabit;
        const oncekiOlcek = sahne.style.getPropertyValue('--kr-olcek');

        olcumKipi(true);

        /* ── ① yazı tipi karşılaştırması: en uzun geçiş, yani en kötü hâl ── */
        const enKotu = GECISLER[2]; /* 'Kızıl Mevsim' → alt başlık */
        sahne.style.setProperty('--kr-olcek', String(enKotu.olcek));

        /* ⚠️ SABİT GENİŞLİK GEÇİŞİN KENDİ UZUNLUĞUNDAN GELİYOR, sabit bir
           sayıdan değil. Bir dönem `--kr-en` varsayılanı `22ch`ti ve alt
           başlık (37 karakter) onu çoktan aşıyordu: `min-width` içerikten
           küçük kalınca hiçbir şey yapmıyor, panel de "sabit" sütununda
           serbestle AYNI sayıyı yazıyordu — yani düğme yalan söylüyordu.
           Buradan çıkan asıl ders panelde değil: sabit genişlik GLOBAL bir
           çözüm olamaz, her adımın kendi kutusunu ayırması gerekir. */
        const enKotuUzunluk = Math.max(enKotu.a.length, enKotu.b.length);

        const satirlar = [];
        for (const ad of YAZI_ADLARI) {
          sahne.style.setProperty('--kr-yazi', YAZILAR[ad]);

          delete sahne.dataset.sabit;
          sahne.style.removeProperty('--kr-en');
          const serbest = olc(enKotu.el(), enKotu.a, enKotu.b, enKotu.ayar);

          sahne.dataset.sabit = '1';
          sahne.style.setProperty('--kr-en', `${enKotuUzunluk}ch`);
          const sabit = olc(enKotu.el(), enKotu.a, enKotu.b, enKotu.ayar);

          const im = (r) =>
            `<span class="${r.fark > esik ? 'kotu' : 'iyi'}">Δ${r.fark.toFixed(1).padStart(5)}px</span>`;
          satirlar.push(
            `${ad.padEnd(8)} serbest ${im(serbest)}   sabit ${im(sabit)}   ${parmakIzi(ad)}`
          );
        }

        if (oncekiYazi) sahne.style.setProperty('--kr-yazi', oncekiYazi);
        delete sahne.dataset.sabit;
        sahne.style.removeProperty('--kr-en');

        /* ── ② her geçişin kendi zıplaması + tuvale sığması ──
           ⚠️ Δ YALNIZ KARAKTER SAYISI SABİTKEN "ZIPLAMA" DEMEK. `karisim()`
           bütün geçiş boyunca `max(basla, hedef)` uzunluğunda bir dize
           üretiyor; hedef daha KISAysa harfler işi bitince düşüyor ve satır
           meşru olarak daralıyor. O satırlarda Δ'yı zıplama diye okumak
           yanlış olurdu, o yüzden hiç yazılmıyor. */
        const tasma = [];
        for (const g of GECISLER) {
          sahne.style.setProperty('--kr-olcek', String(g.olcek));
          void sahne.offsetWidth;
          const r = olc(g.el(), g.a, g.b, g.ayar);
          const oran = (r.enGenis / en) * 100;
          const sigar = r.enGenis <= en;
          const kisalir = g.b.length < g.a.length;
          const zip = kisalir ? '  · kısalıyor' : `  Δ${r.fark.toFixed(0).padStart(4)}px`;
          tasma.push(
            `${g.ad.padEnd(12)} ×${String(g.olcek).padStart(4)} ` +
              `en geniş ${`${r.enGenis.toFixed(0)}px`.padStart(6)} ` +
              `<span class="${sigar ? 'iyi' : 'kotu'}">%${oran.toFixed(0).padStart(3)}</span>` +
              zip
          );
        }

        olcumKipi(false);
        if (oncekiOlcek) sahne.style.setProperty('--kr-olcek', oncekiOlcek);
        else sahne.style.removeProperty('--kr-olcek');
        if (oncekiSabit) sahne.dataset.sabit = oncekiSabit;

        olcuKutusu.innerHTML =
          `<b>GENİŞLİK ZIPLAMASI</b>  "${enKotu.a}" → "${enKotu.b}"\n` +
          `tuval ${en}px · ${KARE_SAYISI} kare · eşik ${esik.toFixed(1)}px (%1,5)\n\n` +
          satirlar.join('\n') +
          `\n\n[ ] = çizilen yüzün parmak izi.\nAynı sayı = aynı yüz (yığın yedeğe düşmüş).\n\n` +
          `<b>TAŞMA</b>  her geçişin en geniş karesi / tuval\n` +
          `%100'ü aşan satır kadraja sığmıyor → OLCEK düşmeli\n\n` +
          tasma.join('\n');

        return satirlar;
      }

      /* ====================================================================
         ÖLÇÜ ② — KONTRAST · PERDE OPAKLIĞININ GEREKÇESİ
         --------------------------------------------------------------------
         "Opaklık düşük olsun ki yazılar ön planda kalsın" bir istek; bu panel
         onu sayıya çeviriyor. Soru şu: perdenin EN KÖTÜ katmanı zeminle
         bindiğinde `--ink` hâlâ okunuyor mu?

         ⚠️ HESAP ANALİTİK, EKRAN GÖRÜNTÜSÜ DEĞİL. `opacity` tam olarak şunu
         yapıyor: `sonuç = zemin·(1-α) + katman·α`. Yani rasterleştiriciye
         gerek yok — bu makinede zaten yok (bkz. `js/karistir.js` §ÇEKİRDEK).
         Ölçüm oynatmadan ve perde görünür olmadan da alınabiliyor.

         ⚠️ KÖTÜMSER, bilerek. Her `fill` en üstteymiş gibi sayılıyor ve
         SVG'nin içindeki grup opaklıkları (`09.svg`de yağmur `opacity=.55`)
         yok sayılıyor. İkisi de sonucu GERÇEKTEN OLDUĞUNDAN KÖTÜ gösteriyor,
         yani panel yeşilse ekran kesinlikle yeşil.

         ⚠️ `--accent` (zemin 2) ÖLÇÜYE GİRMİYOR ve bu bir ihmal değil. O
         zeminde `--ink` kontrastı perde olmadan bile 2.4:1 — okunacak cümle
         değil, bir buçuk saniyelik iri bir kelime taşıyor ve zaten yalnız 1.
         dilimde görünüyor (gerekçe: `css/sunus.css` §ZEMİN). Onu bu tabloya
         katmak her satırı kırmızı yapar ve tablonun söylediği şeyi yok ederdi.
         ==================================================================== */
      const perdeKutusu = document.getElementById('olcu-perde');

      /* WCAG 2.x bağıl parlaklık ve kontrast. Eşik 4.5:1 (normal metin);
         `--fs-lg` ve üstü için 3.0 de kabul, panel ikisini de işaretliyor. */
      const ESIK = 4.5;

      function renkCoz(metin) {
        const s = metin.trim();
        const k = s.startsWith('#') ? s.slice(1) : s;
        const uzun = k.length === 3 ? [...k].map((c) => c + c).join('') : k;
        return [0, 2, 4].map((i) => parseInt(uzun.slice(i, i + 2), 16) / 255);
      }

      function parlaklik([r, g, b]) {
        const f = (c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
        return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
      }

      function kontrast(a, b) {
        const [x, y] = [parlaklik(a), parlaklik(b)].sort((p, q) => q - p);
        return (x + 0.05) / (y + 0.05);
      }

      /** `ust`ü `zemin`in üstüne `alfa` saydamlıkla bindirir. */
      const bindir = (zemin, ust, alfa) => zemin.map((z, i) => z * (1 - alfa) + ust[i] * alfa);

      /* Tokenlar temadan okunuyor, elle yazılmıyor: `?tema=light` ile panel de
         açık temanın sayılarını vermeli. */
      const token = (ad) =>
        renkCoz(getComputedStyle(document.documentElement).getPropertyValue(ad));

      /**
       * Bir perdenin bütün `fill` renklerini toplar.
       *
       * `fill="none"` atlanıyor (boyamıyor); tekrar edenler teke iniyor, çünkü
       * aranan şey en kötü RENK, kaç kez kullanıldığı değil.
       */
      function katmanRenkleri(svg) {
        const renkler = new Set();
        for (const el of svg.querySelectorAll('[fill]')) {
          const f = el.getAttribute('fill');
          if (f && f !== 'none') renkler.add(f);
        }
        return [...renkler];
      }

      function kontrastOlc() {
        const yazi = token('--ink');
        const zeminler = [
          ['1 paper', token('--paper')],
          ['3 sunken', token('--paper-sunken')]
        ];

        const simdiki = Number(
          getComputedStyle(sahne).getPropertyValue('--kr-perde-opak').trim() || 0
        );

        /* Perdenin `alfa` opaklığındaki EN KÖTÜ kontrastı ve onu veren renk. */
        function enKotu(renkler, alfa) {
          let dip = Infinity;
          let suclu = '';
          let neZemin = '';
          for (const [zAd, zemin] of zeminler) {
            for (const ham of renkler) {
              const k = kontrast(yazi, bindir(zemin, renkCoz(ham), alfa));
              if (k < dip) {
                dip = k;
                suclu = ham;
                neZemin = zAd;
              }
            }
          }
          return { dip, suclu, neZemin };
        }

        /* Eşiği geçen EN YÜKSEK opaklık. Kaba tarama bilerek: aralık 0–1 ve
           adım 0.01, yani 100 deneme — ikili arama yazmaya değmez ve
           monotonluk varsayımı da gerektirmezdi. */
        function tavan(renkler, esik) {
          let en = 0;
          for (let a = 0; a <= 1.0001; a += 0.01) {
            if (enKotu(renkler, a).dip >= esik) en = a;
          }
          return en;
        }

        const satirlar = [];
        for (const [ad, svg] of perdeler) {
          const renkler = katmanRenkleri(svg);
          const yalin = enKotu(renkler, 0);
          const simdi = enKotu(renkler, simdiki);
          const t45 = tavan(renkler, ESIK);
          const t30 = tavan(renkler, 3);

          const im = (v) =>
            `<span class="${v >= ESIK ? 'iyi' : v >= 3 ? '' : 'kotu'}">${v.toFixed(1).padStart(5)}:1</span>`;

          satirlar.push(
            `${ad.padEnd(7)} ${String(renkler.length).padStart(2)} renk  ` +
              `yalın ${im(yalin.dip)}  perdeli ${im(simdi.dip)}  ` +
              `tavan ${t45.toFixed(2)} / ${t30.toFixed(2)}  ` +
              `${simdi.suclu} @ ${simdi.neZemin}`
          );
        }

        /* Dilim → perde eşlemesi `js/sunus.js`ten geliyor, burada kopyası yok:
           bir dilimin sahnesi değişince bu satır kendiliğinden değişiyor. */
        const eslesme = Object.entries(DILIM_PERDESI)
          .map(([d, p]) => `${d}→${p}`)
          .join('  ');

        perdeKutusu.innerHTML =
          `<b>KONTRAST</b>  perde katmanı zeminle bindiğinde yazı okunur mu?\n` +
          `α = ${simdiki.toFixed(2)} · yazı --ink · eşik ${ESIK}:1 (iri yazıda 3.0)\n` +
          `tavan = eşiği geçen EN YÜKSEK α  (4.5 / 3.0)\n\n` +
          satirlar.join('\n') +
          `\n\n${eslesme}\n` +
          `kötümser: grup opaklıkları sayılmıyor, her fill en üstte varsayılıyor.\n` +
          `zemin 2 (--accent) tabloda yok — orada yalın kontrast zaten 2.4:1.`;
      }

      /* ====================================================================
         ÖLÇÜ ③ — DİLİM SÜRELERİ
         --------------------------------------------------------------------
         Motor ölçmüyor, ÖLÇÜLMESİNE İZİN VERİYOR: `hikaye:dilim` olayının
         `detail.soz`u koreografinin sözü. Burada zamanı tutup beyan edilenle
         karşılaştırıyoruz. Ölçüm motorun içinde olsaydı her gömülen hikâye
         onu taşımak zorunda kalırdı.
         ==================================================================== */
      const sureKutusu = document.getElementById('olcu-sure');
      const OLCUMLER = new Map();

      function sureleriYaz() {
        const satirlar = dilimler.map(({ id, sure }) => {
          const olculen = OLCUMLER.get(id);
          const ad = id.padEnd(8);
          const beyan = `${sure}ms`.padStart(8);
          if (olculen === undefined) return `${ad} ${beyan} ${'—'.padStart(8)} ${'—'.padStart(7)}`;

          const pay = sure - olculen;
          const payMetni = (pay < 0 ? '' : '+') + pay.toFixed(0);
          return (
            `${ad} ${beyan} ${`${olculen.toFixed(0)}ms`.padStart(8)} ` +
            `<span class="${pay < 0 ? 'kotu' : 'iyi'}">${payMetni.padStart(7)}</span>`
          );
        });

        sureKutusu.innerHTML =
          `<b>DİLİM SÜRELERİ</b>${azHareket() ? '  (hareket azaltma açık)' : ''}\n` +
          `${'dilim'.padEnd(8)} ${'beyan'.padStart(8)} ${'ölçülen'.padStart(8)} ${'pay'.padStart(7)}\n\n` +
          satirlar.join('\n') +
          `\n\npay = beyan − ölçülen. Negatifse çubuk\nanimasyonu ortasından kesiyor.`;
      }

      /* ⚠️ DİNLEYİCİ `hikaye()`DEN ÖNCE BAĞLANIYOR. İlk `hikaye:dilim` olayı
         motorun kurucusunun İÇİNDE, eşzamanlı atılıyor — sonradan bağlanan
         dinleyici ilk dilimi hiç görmezdi. */
      sahne.addEventListener('hikaye:dilim', (olay) => {
        const { id, soz } = olay.detail;
        const t0 = performance.now();
        soz.then(({ iptal }) => {
          /* Yarıda kesilen koreografinin süresi ölçüm DEĞİL: okur atladı diye
             dilim "hızlı bitti" sayılmamalı. */
          if (iptal) return;
          OLCUMLER.set(id, performance.now() - t0);
          sureleriYaz();
        });
      });

      sahne.addEventListener('hikaye:bitti', () => console.info('hikaye:bitti'));

      sureleriYaz();

      /* ⚠️ ÖLÇÜM ÖNCE, HİKÂYE SONRA. İkisi aynı elemanı kullanıyor; ölçüm
         eşzamanlı ve elemanı bıraktığı gibi geri veriyor, ama oynatma sürerken
         çağrılırsa aradaki kareyi ezer. Bu yüzden ölçüm başta bir kez alınıyor,
         sonrası düğmede.

         Kontrast panosunun böyle bir kısıtı yok (DOM'a hiç dokunmuyor, yalnız
         öznitelik okuyor) ama aynı yerde çağrılıyor: ikisi de "Yeniden ölç"
         düğmesinin arkasında. */
      karsilastir();
      kontrastOlc();

      if (azHareket()) {
        olcuKutusu.innerHTML =
          '<b>HAREKET AZALTMA AÇIK</b>\nkaristir() hedefi anında yazıyor,\n' +
          'karışma hiç başlamıyor — ölçüm yine de\ngeçerli, çünkü karisim() saf.\n' +
          'Hikâye kendiliğinden ilerlemiyor:\nsağa sola tıkla ya da ok tuşlarına bas.';
      }

      const h = hikaye(sahne, dilimler, {
        ...SAYI_AYARI,
        dongu: soru.get('dongu') !== '0',
        basla: soru.get('dur') !== '1',
        gorus: soru.get('gorus') !== '0',
        /* Tezgâhta ok tuşlarını kapan başka bir şey yok; sayfaya gömülen
           hikâye bu bayrağı AÇMAMALI (bkz. `js/hikaye.js` §KLAVYE). */
        klavye: 'belge'
      });

      const baslangic = dilimler.findIndex((d) => d.id === soru.get('dilim'));
      if (baslangic > 0) h.git(baslangic);

      document.getElementById('tekrar').addEventListener('click', () => h.git(0));
      document.getElementById('olcum').addEventListener('click', () => {
        karsilastir();
        kontrastOlc();
      });

      const duraklatDugmesi = document.getElementById('duraklat');
      duraklatDugmesi.addEventListener('click', () => {
        if (h.duraktaMi) {
          h.surdur('elle');
          duraklatDugmesi.textContent = 'Duraklat';
        } else {
          h.durakla('elle');
          duraklatDugmesi.textContent = 'Sürdür';
        }
      });
      if (soru.get('dur') === '1') duraklatDugmesi.textContent = 'Sürdür';

      document.documentElement.dataset.hazir = '1';
    </script>
  </body>
</html>
