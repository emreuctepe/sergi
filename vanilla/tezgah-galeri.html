<!doctype html>
<!--
  ════════════════════════════════════════════════════════════════════════════
  TEZGÂH — "Akıllı Kız" sergisi (ms-galeri)
  ────────────────────────────────────────────────────────────────────────────
  Sayının içinde sergi otuzuncu sayfada ve her bakışta oraya inmek gerekiyor.
  Burası aynı sayfayı iki türlü gösteriyor:

    ① ŞERİDİN TAMAMI — kırpılmamış, sığacak kadar küçültülmüş. Koridorun
      ritmini, çerçeve aralıklarını ve dikişsizliği ancak böyle görebiliyorsun.
    ② KAMERA — gerçek 3:4 kadraj, gerçek boyutta. Okurun gördüğü şey bu.

  Yanındaki kayıtlar `--gal-*` değişkenlerini CANLI değiştiriyor. Adım 2'de
  referanstan ölçülen renkler buraya girilip gözle doğrulanacak, sonra
  `uret.py` ve `css/galeri.css` içindeki yedeklere yazılacak.

  ⚠️ SAYFAYI KOPYALAMIYOR, FETCH EDİYOR. Donmuş bir kopya ilk üretimde yalan
  söylemeye başlardı; tezgâhın varlık sebebi ölçülerin gerçek sayıyla aynı
  olması.

  ⚠️ Sayı bu dosyaya BAKMIYOR. `index.html`, `okuyucu.js`, `galeri.js` — hiçbiri
  buradan haberdar değil; dosya silinse sayı aynen çalışır.

  Çalıştırmak:  python3 -m http.server 8080 --directory vanilla
  Sonra:        http://localhost:8080/tezgah-galeri.html
  ════════════════════════════════════════════════════════════════════════════
-->
<html lang="tr" data-theme="dark" data-issue="2026-09" data-depth="full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tezgâh · Akıllı Kız sergisi</title>

    <!-- Küresel stiller GERÇEK dosyadan. Kopyalanmadı; bkz. başlıktaki not. -->
    <link rel="stylesheet" href="css/app.css" />

    <style>
      body {
        margin: 0;
        display: grid;
        grid-template-columns: 1fr 268px;
        min-height: 100vh;
        background: #14140f;
        color: #e8e3d8;
        font: 13px/1.5 system-ui, sans-serif;
      }

      .tz__sahne {
        padding: 20px;
        overflow: auto;
      }

      .tz__baslik {
        margin: 0 0 8px;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #8f8878;
      }

      /* ① ŞERİDİN TAMAMI. `.galeri__kamera`nın kırpması burada kaldırılıyor:
         şerit kendi tam genişliğinde duruyor ve kapsayıcı onu ölçekliyor. */
      .tz__serit-kutu {
        overflow-x: auto;
        margin-bottom: 26px;
        border: 1px solid #2e2c24;
        background: #0b0b08;
      }
      .tz__serit-kutu .galeri__kamera {
        position: relative;
        overflow: visible;
        height: 200px;
        aspect-ratio: auto;
      }
      .tz__serit-kutu .galeri__serit {
        position: relative;
        width: auto;
        height: 200px;
      }
      .tz__serit-kutu .galeri__kaplama,
      .tz__serit-kutu .galeri__bolge,
      .tz__serit-kutu .galeri__levha,
      .tz__serit-kutu .page__bg::after {
        display: none;
      }

      /* Durak sınırlarını gösteren kılavuz. Çerçevelerin gerçekten ADIM
         aralığında oturup oturmadığı ancak üstüne çizgi konunca anlaşılıyor. */
      .tz__kilavuz {
        position: relative;
        height: 0;
      }
      .tz__kilavuz i {
        position: absolute;
        top: -200px;
        width: 1px;
        height: 200px;
        background: #d8433a;
        opacity: 0.55;
      }
      .tz__kilavuz i::after {
        content: attr(data-n);
        position: absolute;
        top: 2px;
        left: 3px;
        font-size: 9px;
        color: #d8433a;
      }

      /* ② KAMERA — gerçek tuval ölçüsünde, sayfadaki gibi. */
      /* ⚠️ --canvas-* BURADA YENİDEN TANIMLANIYOR. canvas.css onları pencereye
         göre hesaplıyor (`min(100vw, 100svh·3/4, 560px)`) ve tezgâhın penceresi
         sayınınkinden farklı; tanımlanmasaydı kadraj sessizce dar kalırdı —
         ölçüldü, 560 yerine 531px. Tezgâhın işi tam ölçüyü göstermek. */
      .tz__kamera-kutu {
        --canvas-w: 560px;
        --canvas-h: 747px;
        width: var(--canvas-w);
        height: var(--canvas-h);
        position: relative;
        border: 1px solid #2e2c24;
        container-type: inline-size;
      }
      .tz__kamera-kutu .page {
        position: absolute;
        inset: 0;
        height: 100%;
      }

      /* ── kayıtlar ── */
      .tz__pult {
        padding: 20px 16px;
        border-left: 1px solid #2e2c24;
        background: #100f0b;
      }
      .tz__pult h2 {
        margin: 0 0 14px;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #8f8878;
      }
      .tz__satir {
        display: grid;
        grid-template-columns: 1fr 34px;
        align-items: center;
        gap: 8px;
        margin-bottom: 7px;
      }
      .tz__satir label {
        font-size: 11px;
        color: #b9b2a3;
      }
      .tz__satir input[type='color'] {
        width: 34px;
        height: 22px;
        padding: 0;
        border: 1px solid #3a382e;
        background: none;
      }
      .tz__aralik {
        display: block;
        margin: 14px 0 4px;
      }
      .tz__aralik input {
        width: 100%;
      }
      .tz__not {
        margin-top: 18px;
        padding-top: 12px;
        border-top: 1px solid #2e2c24;
        font-size: 11px;
        line-height: 1.5;
        color: #857e70;
      }
      .tz__dok {
        width: 100%;
        margin-top: 10px;
        padding: 7px;
        border: 1px solid #3a382e;
        background: #1c1a14;
        color: #e8e3d8;
        font: inherit;
        cursor: pointer;
      }
      .tz__cikti {
        width: 100%;
        margin-top: 8px;
        min-height: 96px;
        border: 1px solid #3a382e;
        background: #0b0b08;
        color: #9fd39f;
        font: 11px/1.45 ui-monospace, monospace;
      }
    </style>
  </head>

  <body>
    <div class="tz__sahne">
      <p class="tz__baslik">① şerit — tamamı, kırpılmamış</p>
      <div class="tz__serit-kutu">
        <div id="serit-yuva"></div>
        <div class="tz__kilavuz" id="kilavuz"></div>
      </div>

      <p class="tz__baslik">② kamera — 560 × 747, okurun gördüğü</p>
      <div class="tz__kamera-kutu" id="kamera-yuva"></div>
    </div>

    <div class="tz__pult">
      <h2>Değerler</h2>
      <div id="kayitlar"></div>

      <label class="tz__aralik">
        Kayma süresi — <span id="sure-yazi">900ms</span>
        <input id="sure" type="range" min="150" max="2400" step="50" value="900" />
      </label>

      <button class="tz__dok" id="dok">Değerleri kopyala</button>
      <textarea class="tz__cikti" id="cikti" readonly></textarea>

      <p class="tz__not">
        Buradaki kayıtlar yalnız bu sayfayı değiştiriyor. Beğenilen değerler
        <code>css/galeri.css</code> ve <code>sayfalar/ms-galeri/uret.py</code>
        içindeki yedeklere elle yazılmalı — ikisi de aynı hex'i taşıyor.
      </p>
    </div>

    <script type="module">
      import { galeriBaslat } from './js/galeri.js';

      /* uret.py'deki DEĞERLER bloğuyla aynı sıra ve aynı adlar. */
      const DEGERLER = [
        ['--gal-tavan', 'tavan'],
        ['--gal-ray', 'ray'],
        ['--gal-duvar', 'duvar'],
        ['--gal-dip', 'duvar dibi (soğuk bant)'],
        ['--gal-zemin', 'zemin'],
        ['--gal-zemin-isik', 'zemin · ışık gölü'],
        ['--gal-koni', 'ışık konisi'],
      ];

      const ham = await (await fetch('sayfalar/ms-galeri/sayfa.html', { cache: 'no-store' })).text();

      /* İKİ AYRI KOPYA. Şerit görünümü kırpmasız, kamera görünümü gerçek —
         tek bir DOM ağacı ikisini birden olamaz. Gezinme yalnız kameraya
         bağlanıyor (galeriBaslat ilk `.galeri`yi buluyor), o yüzden kamera
         DOM'a ÖNCE giriyor. */
      const yap = () => {
        const t = document.createElement('template');
        t.innerHTML = ham;
        return t.content.firstElementChild;
      };

      document.getElementById('kamera-yuva').append(yap());
      document.getElementById('serit-yuva').append(yap());

      const kok = document.documentElement;

      /* ── renk kayıtları ── */
      const kayitlar = document.getElementById('kayitlar');
      for (const [degisken, ad] of DEGERLER) {
        const satir = document.createElement('div');
        satir.className = 'tz__satir';
        const baslangic = getComputedStyle(document.querySelector('.galeri'))
          .getPropertyValue(degisken)
          .trim();
        satir.innerHTML = `<label for="k${degisken}">${ad}</label>`;
        const giris = document.createElement('input');
        giris.type = 'color';
        giris.id = `k${degisken}`;
        giris.value = baslangic || '#000000';
        giris.addEventListener('input', () => kok.style.setProperty(degisken, giris.value));
        satir.append(giris);
        kayitlar.append(satir);
      }

      /* ── süre ── */
      const sure = document.getElementById('sure');
      const sureYazi = document.getElementById('sure-yazi');
      sure.addEventListener('input', () => {
        sureYazi.textContent = `${sure.value}ms`;
        kok.style.setProperty('--sure', `${sure.value}ms`);
      });

      /* ── durak kılavuzu ────────────────────────────────────────────────
         Çizgiler şeridin GÖRÜNEN genişliğine göre konuyor, tasarım birimine
         göre değil: şerit burada 200px yüksekliğe ölçekleniyor ve tasarım
         birimleriyle konan bir çizgi kayardı. */
      const seritSvg = document.querySelector('#serit-yuva .galeri__serit');
      const kilavuz = document.getElementById('kilavuz');
      const galeri = document.querySelector('.galeri');
      const adet = Number(galeri.style.getPropertyValue('--adet'));
      const adimOran = Number(galeri.style.getPropertyValue('--adim-oran'));

      requestAnimationFrame(() => {
        const en = seritSvg.getBoundingClientRect().width;
        /* ⚠️ KAMERA ve ADIM buraya SAYI OLARAK yazılmıyor. --serit-en zaten
           W/KAMERA olduğu için kameranın şeritteki payı 100/serit-en; ADIM'ın
           payı da --adim-oran. İkisi de sayfadan geliyor, yani `uret.py`de ADIM
           değişince kılavuz kendiliğinden uyuyor. Elle yazılsaydı çizgiler
           sessizce yanlış yere düşerdi ve tezgâh tam da doğrulamak için var
           olduğu şey hakkında yalan söylerdi. */
        const kameraPayi = 100 / parseFloat(galeri.style.getPropertyValue('--serit-en'));
        for (let i = 0; i < adet; i++) {
          const c = document.createElement('i');
          /* durak i'nin kadraj ORTASI = (i·ADIM + KAMERA/2) / W */
          c.style.left = `${en * (i * adimOran + kameraPayi / 2)}px`;
          c.dataset.n = String(i + 1).padStart(2, '0');
          kilavuz.append(c);
        }
      });

      /* ── dökme ── */
      document.getElementById('dok').addEventListener('click', () => {
        const stil = getComputedStyle(document.querySelector('.galeri'));
        document.getElementById('cikti').value = DEGERLER.map(
          ([d]) => `${d}: ${stil.getPropertyValue(d).trim()};`
        ).join('\n');
      });

      galeriBaslat();
    </script>
  </body>
</html>
