  <script class="galeri__veri" type="application/json">[{"kutu":[32.917,34.596,34.167,25.279],"dosya":"assets/2026-09/akilli-kiz/01.webp","ad":"İşler Yolunda","alt":"Ece Özgür · dijital çizim, 2026","metin":"Kalabalık bir kasaba, bir tüccar, eşi ve tek kızları. Üçü de gülüyor, terazi babanın elinde ve masalın söylediği tek şey işlerin iyi gittiği. Ama seride bir daha hiç bu kadar masum görünmeyecek bir şey çoktan kadrajda: bastıkları zemin siyah ve beyaz çakılla kaplı. Masalın kızı on durak sonra kurtaran şey o taşlar olacak ve bu karede kimse onlara bakmıyor."},{"kutu":[32.917,34.596,34.167,25.279],"dosya":"assets/2026-09/akilli-kiz/02.webp","ad":"İlaç Kore'den Geliyor","alt":"Ece Özgür · dijital çizim, 2026","metin":"Anne yatakta, ağzında derece; hastalık gün geçtikçe ağırlaşıyor. Doktorlar iyileşme umudu vermiyor, tek çare diye Kore'den getirilen bir ilacı gösteriyorlar. Çizim üç kişiyi üç ayrı uzaklığa koymuş: anne en geride, kız yastığın hemen yanında, baba ise kadrajın önünde ve yüzü dağılmış tek yüz o. Haberi ilk alan, bize en yakın duran."},{"kutu":[32.917,34.596,34.167,25.279],"dosya":"assets/2026-09/akilli-kiz/03.webp","ad":"Para Yanıyor","alt":"Ece Özgür · dijital çizim, 2026","metin":"Tüccar ilacı almayı bırakmıyor; birikimi tükenince borca giriyor. Üç panel, üç ayrı dil: beyaz hız çizgileri içinde verilen haber, kırmızı tramın üstünde sandıktan aleve giden ok, ve sağda, kadrajın boyunca uzanan tek parça sevinç — やった〜. Alanın en büyüğü iyi haberi alana ayrılmış, kötü haberi alanlara değil."},{"kutu":[32.917,34.596,34.167,25.279],"dosya":"assets/2026-09/akilli-kiz/04.webp","ad":"Geriye Borç Kaldı","alt":"Ece Özgür · dijital çizim, 2026","metin":"İlaç işe yaramadı, kadın öldü ve tüccara dağ gibi bir borç kaldı. Adam yerde, hiçbir şey yapamaz hâlde. Serinin rengi olmayan tek karesi bu — on çizimin dokuzunda gökyüzü, tram ya da bir kalp var, burada yalnız grinin basamakları. Yasın çizime yaptığı şey, çizerin paletini elinden almak."},{"kutu":[32.917,34.596,34.167,25.279],"dosya":"assets/2026-09/akilli-kiz/05.webp","ad":"Alacağımı Tahsile Geldim","alt":"Ece Özgür · dijital çizim, 2026","metin":"Tefeci kapıda: ödeyemezseniz dava açarım, ama ben o kadar kalpsiz değilim — kızınızı verin, borcu sileyim. Kadraj bütünüyle onun; yüzü çerçeveyi dolduruyor ve hız çizgileri arkasından dışarı taşıyor. Baba ile kız ise soldaki iki küçük balonun içine sığmış. Teklifi yapan büyüyor, teklifi alanlar küçülüyor."},{"kutu":[32.917,34.596,34.167,25.279],"dosya":"assets/2026-09/akilli-kiz/06.webp","ad":"İkinci Teklif","alt":"Ece Özgür · dijital çizim, 2026","metin":"Tefeci kıza uzun zamandır ilgi duyuyormuş; aradaki büyük yaş farkına rağmen bir kez istemiş ve reddedilmiş. Bu ikinci teklife ne baba ne kız seviniyor. Çizim bunu tek bir asimetriyle söylüyor: kalpler kadrajın yalnız bir yanında. Öbür yanda kızın üstüne inen dikey tarama var — aynı sahne, iki ayrı hava."},{"kutu":[32.917,34.596,34.167,25.279],"dosya":"assets/2026-09/akilli-kiz/07.webp","ad":"Bahis","alt":"Ece Özgür · dijital çizim, 2026","metin":"Teklif: keseye biri ak biri kara iki taş koyacağım. Kara çekersen benimle evlenirsin ve borç silinir, ak çekersen ikisi de silinir — kabul etmezsen baban hapse girer. Tefeci ゲラゲラ diye gülerek, kesesi elinde yürüyor; iki yanında kabaran şey ilk karenin zemini, yani birazdan kullanacağı taşların ta kendisi. Üstünde yürüdüğü şeyi silah yapacak."},{"kutu":[32.917,34.596,34.167,25.279],"dosya":"assets/2026-09/akilli-kiz/08.webp","ad":"Taş Elimden Düştü","alt":"Ece Özgür · dijital çizim, 2026","metin":"Başka çaresi kalmayan kız bahsi kabul ediyor, elini keseye sokuyor ve taşı — dikkatsizce — düşürüyor. Taş yuvarlanıp bahçedeki öbür taşların arasına karışıyor. Kadrajda iki şey aynı anda oluyor: kız gülümsüyor, sağ kenarda bir şimşek çakıyor. Ne olduğunu bilen tek kişi ile daha yeni anlamaya başlayan kişi aynı karede."},{"kutu":[32.917,34.596,34.167,25.279],"dosya":"assets/2026-09/akilli-kiz/09.webp","ad":"Kesedeki Taşın Rengi","alt":"Ece Özgür · dijital çizim, 2026","metin":"«Ne kadar sakarım, rengine bakmaya bile fırsat bulamadım» deyip yerden beyaz bir taş alıyor: kesede kalan taşa bakarsanız benimkinin rengi belli olur. Tefeci keseye iki kara taş koyduğunu biliyor ve bunu söyleyemiyor. Panel tam ortadan ayrılmış: solda cevabı veren düşünce balonu — 白い — sağda cevabı bilen ama ağzını açamayan yüz, tek bir «?!» ile. Çizim ikisini bilerek aynı kareye koymuyor."},{"kutu":[32.917,34.596,34.167,25.279],"dosya":"assets/2026-09/akilli-kiz/10.webp","ad":"Borç Silindi","alt":"Ece Özgür · dijital çizim, 2026","metin":"«Bu kız gerçekten becerikliymiş.» Tefeci sözünde duruyor: evlilikten vazgeçiyor, borcu da siliyor. Masal burada bitiyor ve kaybedenin ne hissettiğini söylemiyor. Çizim söylüyor — gökkuşağının altında ikisi birden gülüyor ve aradaki büyük 勝ち kimin olduğunu belirtmiyor. Kurnazlıkla kazanılmış bir davayı kimsenin küçük düşmediği bir sahneyle kapatmak, çizerin masala eklediği tek cümle."}]</script>
