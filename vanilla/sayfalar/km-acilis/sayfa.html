<section
  class="page page--overlay"
  data-page-id="km-acilis"
  data-mod="all"

  data-kind="opener"
  data-scene="parallax"
  data-fit="contain"
  data-bleed="full"
  data-inview="true"
  role="group"
  aria-roledescription="sayfa"
>
  <div class="page__bg">
    <picture
      ><source
        type="image/avif"
        srcset="
          assets/2026-09/sisli-vadi-600.avif   600w,
          assets/2026-09/sisli-vadi-900.avif   900w,
          assets/2026-09/sisli-vadi-1200.avif 1200w
        "
        sizes="(max-width: 640px) 100vw, 600px" />
      <img
        class="page__bg-img"
        src="assets/2026-09/sisli-vadi.webp"
        sizes="(max-width: 640px) 100vw, 600px"
        alt=""
        loading="lazy"
        fetchpriority="auto"
        decoding="async"
    /></picture>
  </div>
  <div class="page__inner">
    <p
      class="kicker blk blk--invert"
      style="--i: 0"
      data-block-id="km-acilis:0"
      data-block-kind="kicker"

      Dosya · Mevsim
    </p>
    <h1
      class="h1 h1--big blk blk--invert"
      style="--i: 1"
      data-block-id="km-acilis:1"
      data-block-kind="h1"

    </h1>

      class="lead blk blk--invert"
      style="--i: 2"
      data-block-id="km-acilis:2"
      data-block-kind="lead"
    >
      Sonbahar bir tarih değil, bir yükseklik meselesidir. Dağdan aşağı iner — günde yaklaşık yirmi
      metre.
    </p>
    <div
      class="byline blk blk--invert"
      style="--i: 3"
      data-block-id="km-acilis:3"
      data-block-kind="byline"
    >
      <span class="byline__author">Emre</span> <span class="byline__role">yazı ve fotoğraflar</span>
      <span class="byline__time">11 dk</span>
    </div>
  </div>
