<!--

  cümlesi bu kadrajda — yüz bin ölünün sebebi sarsıntı değil yangındı.

  ⚠️ RENKLER TEMAYI İZLEMİYOR ve bu bilinçli. Yanındaki altı sahne (paper,
  leaves, waves, street, sumi, torii) `var(--paper)` / `var(--accent)`
  kullanıyor ve tema koyuya dönünce onlar da dönüyor. Kantō sahneleri dönmüyor:
  hexler sabit, kaynağı `src/lib/art/kanto/palet.ts`teki `ATES` ailesi. Sebep
  o dosyanın başında yazılı — bu sahneler DESEN değil IŞIK, ve bir yangının
  anlamı karanlığın içindeki tek parlak kütle olmasında. `--paper` açık temada
  #f5f1e8'e dönseydi değer yapısı çökerdi.

  Sahnenin tek ışık kaynağı YERDE. Duvarın kâğıt gözleri bu yüzden yukarı
  doğru koyulaşıyor — ama dört ayrı düz yüzeyde, basamak basamak. Sürekli bir
