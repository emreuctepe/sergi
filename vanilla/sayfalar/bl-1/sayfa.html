<!--
  BULMACA — emoji bilmecesi.

  Sayfa BOŞ doğuyor: sekiz soruyu da şıkları da `js/bulmaca.js` kuruyor, çünkü
  ekranda aynı anda tek soru var ve hangisi olduğu duruma bağlı. Buradaki tek
  içerik, JS hiç çalışmazsa okurun görmesi gereken satır — dosyada duruyor ki
  boş bir sayfa yerine bir açıklama kalsın.

  ⚠️ data-fit="contain": oyun tuvale SIĞMAK ZORUNDA. `.page`te `overflow:
  hidden` var, taşan şey uyarısız kesilir. Düzenin nasıl esnediği
  `css/puzzles.css` §DÜZEN'de; soru eklerken oraya bak.
-->
<section
  class="page"
  data-page-id="bl-1"
  data-mod="all"
  data-section="bulmaca"
  data-section-title="Bulmaca"
  data-kind="puzzle"
  data-scene="fade-up"
  data-fit="contain"
  data-bleed="none"
  data-inview="true"
  role="group"
  aria-roledescription="sayfa"
>
  <div class="page__bg">
    <svg
      class="art"
      viewBox="0 0 300 400"
      preserveAspectRatio="xMidYMid slice"
      aria-hidden="true"
      focusable="false"
    >
      <rect width="300" height="400" fill="var(--paper)"></rect>
      <circle cx="270" cy="-20" r="120" fill="var(--accent)" opacity="0.05"></circle>
      <circle cx="10" cy="420" r="150" fill="var(--accent-3)" opacity="0.05"></circle>
    </svg>
  </div>
  <div class="page__inner">
    <p class="kicker blk" style="--i: 0" data-block-id="bl-1:0" data-block-kind="kicker">Oyun</p>
    <h1 class="h1 blk" style="--i: 1" data-block-id="bl-1:1" data-block-kind="h1">
      Bu ayın bulmacası
    </h1>
    <p class="lead blk" style="--i: 2" data-block-id="bl-1:2" data-block-kind="lead">
      Sekiz soru, hepsi Japonya'dan.
    </p>
    <div
      class="bulmaca blk"
      id="bulmaca"
      style="--i: 3"
      data-block-id="bl-1:3"
      data-block-kind="puzzle"
    >
      <p class="note">Bulmacayı oynamak için JavaScript gerekiyor.</p>
    </div>
  </div>
</section>
