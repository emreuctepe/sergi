<section
  class="page"
  data-page-id="sz-1"
  data-mod="all"
  data-section="sozluk"

  data-kind="list"
  data-scene="stagger"
  data-fit="contain"
  data-bleed="none"
  data-inview="true"
  role="group"

>
  <div class="page__bg">
    <picture
      ><source
        type="image/avif"
        srcset="

          assets/2026-09/dalga-900.avif   900w,
          assets/2026-09/dalga-1200.avif 1200w

        sizes="(max-width: 640px) 100vw, 600px" />

        class="page__bg-img"
        src="assets/2026-09/dalga.webp"
        sizes="(max-width: 640px) 100vw, 600px"
        alt=""
        loading="lazy"
        fetchpriority="auto"

  <div class="page__inner">

      <svg class="rule" viewBox="0 0 120 8" aria-hidden="true">
        <path d="M0 4 H44" stroke="currentColor" stroke-width="1"></path>
        <circle cx="60" cy="4" r="3" fill="currentColor"></circle>
        <path d="M76 4 H120" stroke="currentColor" stroke-width="1"></path>
      </svg>
    </div>
    <p class="lead blk" style="--i: 3" data-block-id="sz-1:3" data-block-kind="lead">
