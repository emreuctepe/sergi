<section
  class="page page--overlay"
  data-page-id="gh-acilis"
  data-mod="all"
  data-section="gece-hatti"
  data-section-title="Gece Hattı"
  data-kind="opener"
  data-scene="mask-wipe"
  data-fit="contain"
  data-bleed="full"
  data-inview="true"
  role="group"
  aria-roledescription="sayfa"
>
  <div class="page__bg">
    <picture
      ><source
        type="image/avif"
        srcset="
          assets/2026-09/tren-600.avif   600w,
          assets/2026-09/tren-900.avif   900w,
          assets/2026-09/tren-1200.avif 1200w
        "
        sizes="(max-width: 640px) 100vw, 600px" />
      <img
        class="page__bg-img"
        src="assets/2026-09/tren.webp"
        sizes="(max-width: 640px) 100vw, 600px"
        alt=""
        loading="lazy"
        fetchpriority="auto"
        decoding="async"
    /></picture>
  </div>
  <div class="page__inner">
    <p
      class="kicker blk blk--invert"
      style="--i: 0"
      data-block-id="gh-acilis:0"
      data-block-kind="kicker"
    >
      Foto-öykü
    </p>
    <h1 class="h1 blk blk--invert" style="--i: 1" data-block-id="gh-acilis:1" data-block-kind="h1">
      Gece Hattı
    </h1>
    <p
      class="lead blk blk--invert"
      style="--i: 2"
      data-block-id="gh-acilis:2"
      data-block-kind="lead"
    >
      Son trenden inen yüz kırk kişi. Hepsi aynı yöne yürüyor ve kimse konuşmuyor.
    </p>
  </div>
</section>
