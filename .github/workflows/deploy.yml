name: Deploy prototype to Pages

# İKİ AYRI YAYIN HEDEFİ VAR — karıştırma:
#
#   GitHub Pages       → PROTOTİP arşivi   (bu dosya)  emreuctepe.github.io/sergi/
#   Cloudflare WORKERS → GERÇEK 1.0 build'i (repo bağlantısı, panelden kurulur)
#
# Gerçek build burada YAYINLANAMAZ: adapter-cloudflare çıktısı bir Worker
# (`.svelte-kit/cloudflare/_worker.js`) ve Pages yalnız statik dosya sunar.
# Faz 2'nin giriş/yorum uçları da sunucu ister. Ayrıntı: README "Yayın" bölümü.
#
# Prototip `prototype/` klasöründe duruyor; GitHub Pages "branch" modu yalnızca
# kök ya da /docs'tan yayınlayabildiği için siteyi buradan (Actions ile) basıyoruz.
# Böylece repo düzeni bozulmadan prototype/ canlıya çıkar.

on:
  push:
    branches: [main]
    # Prototip donduruldu; her commit'te yeniden basmak boşuna koşu ve
    # "Pages deployed" bildirimi demek olurdu. Yalnız kendisi değişince çalışır.
    paths:
      - 'prototype/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek dağıtım; yenisi gelirse eskisini iptal et
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype # ← siteyi prototype/ klasöründen (index.html orada) basar
      - id: deployment
        uses: actions/deploy-pages@v4
